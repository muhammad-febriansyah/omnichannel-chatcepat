# Apache (cPanel/WHM) reverse proxy ChatCepat.
# Proxy path tertentu ke gateway Go (127.0.0.1:8080); sisanya tetap dilayani
# vhost web seperti biasa.
#
#   /webhooks/*  -> gateway (webhook Meta/Telegram; verify HMAC butuh body utuh)
#   /ws          -> gateway (WebSocket realtime)
#
# JANGAN proxy /channels (itu route dashboard web).
#
# PRASYARAT modul (WHM > Apache Configuration > pastikan aktif, atau `a2enmod`):
#   proxy proxy_http proxy_wstunnel
#
# PASANG di cPanel/WHM (pilih satu):
#  A. Per-domain SSL vhost include (disarankan):
#     buat file:
#       /etc/apache2/conf.d/userdata/ssl/2_4/<cpanel_user>/chatcepat.id/proxy.conf
#     isi dengan blok di bawah, lalu:
#       /usr/local/cpanel/scripts/rebuildhttpdconf && systemctl restart httpd
#  B. WHM > Apache Configuration > Include Editor > Post VirtualHost Include
#     (berlaku global; hanya kalau cuma 1 domain di server).

# WebSocket: arahkan upgrade ke ws:// (mod_proxy_wstunnel).
ProxyPass        /ws  ws://127.0.0.1:8080/ws
ProxyPassReverse /ws  ws://127.0.0.1:8080/ws

# Webhook channel. Body diteruskan utuh (signature dihitung atas raw body).
ProxyPass        /webhooks/  http://127.0.0.1:8080/webhooks/
ProxyPassReverse /webhooks/  http://127.0.0.1:8080/webhooks/

# Teruskan header asli ke gateway.
RequestHeader set X-Forwarded-Proto "https"
ProxyPreserveHost On
