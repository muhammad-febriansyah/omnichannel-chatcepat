# cPanel EA-nginx server-include — proxy path tertentu ke gateway Go (127.0.0.1:8080).
# Hanya blok `location` (masuk ke server{} yang di-generate cPanel). JANGAN tambah
# server{}/upstream/TLS — cPanel sudah urus. `location /` bawaan tetap layani web.
#
#   /webhooks/*  -> gateway (webhook Meta/Telegram; body utuh utk verify HMAC)
#   /ws          -> gateway (WebSocket realtime)
#   JANGAN proxy /channels (route dashboard web).
#
# proxy_pass tanpa path → URI penuh diteruskan apa adanya
# (mis. /webhooks/meta/fb tetap /webhooks/meta/fb di gateway).
#
# PASANG (global, semua server block — cocok bila 1 domain utama):
#   cp ea-nginx-chatcepat.conf /etc/nginx/conf.d/server-includes/chatcepat-proxy.conf
#   nginx -t && systemctl reload nginx
# (Per-domain saja: taruh di
#   /etc/nginx/conf.d/users/<user>/chatcepat.id/server-includes/chatcepat-proxy.conf
#  lalu: /usr/local/cpanel/scripts/ea-nginx rebuild && nginx -t && systemctl reload nginx)

location /ws {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

location /webhooks/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering on;   # default; jangan stream agar body utuh
    proxy_read_timeout 30s;
}
